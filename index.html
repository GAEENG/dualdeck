<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Two independent audio players with VLC-style controls. Play files from your iPhone or online streams, mixed together.">
<title>DualDeck Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DualDeck">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  /* Layout: two always-visible channel strips (the mixer) above the selected deck's full controls. */
  --bg: #0b0d12;
  --panel: #141821;
  --raise: #1c2230;
  --line: #272e3d;
  --text: #eaedf3;
  --muted: #8f98a9;
  --a: #ff8a1f;
  --b: #2fd0c3;
  --danger: #ff6b6b;
  --warn: #f5bd52;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 16px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.35; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body { overscroll-behavior-y: contain; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--acc, var(--a)); outline-offset: 2px; }
.ic { width: 24px; height: 24px; fill: currentColor; flex: none; display: block; }
.ic.sm { width: 20px; height: 20px; }
.vh { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

#app { max-width: 560px; margin: 0 auto; min-height: 100%; padding: calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 16px); display: flex; flex-direction: column; gap: 12px; }

/* Header */
.top { display: flex; align-items: center; gap: 4px; min-height: 52px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand h1 { margin: 0; font: 700 21px/1.1 var(--font-display); letter-spacing: .2px; }
.brand p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.logo { width: 36px; height: 36px; flex: none; }
.ibtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--text); }
.ibtn:active { background: var(--raise); }

/* Banners */
.banners { display: grid; gap: 8px; }
.banners:empty { display: none; }
.banner { display: flex; gap: 8px; align-items: flex-start; padding: 10px 8px 10px 12px; border-radius: 12px; background: #182134; border: 1px solid #2a3753; font-size: 14px; line-height: 1.4; }
.banner.warn { background: #2a2214; border-color: #4d3c1d; }
.banner p { margin: 0; flex: 1; padding-top: 2px; }
.banner .act { font-weight: 700; color: var(--a); padding: 2px 6px; min-height: 28px; }
.banner .x { color: var(--muted); width: 28px; height: 28px; display: grid; place-items: center; }

/* Mixer strips */
.mixer { display: grid; gap: 8px; }
.strip { --acc: var(--a); position: relative; display: grid; grid-template-columns: 52px minmax(0, 1fr) 40px; grid-template-areas: "play main lock" "vol vol vol"; gap: 2px 10px; align-items: center; padding: 10px 6px 4px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.strip[data-deck="B"] { --acc: var(--b); }
.strip.sel { border-color: #3a4357; }
.strip.sel::before { content: ""; position: absolute; left: -1px; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: var(--acc); }
.pbtn { grid-area: play; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--acc); color: #0b0d12; position: relative; }
.pbtn .ic { width: 26px; height: 26px; }
.smain { grid-area: main; min-width: 0; text-align: left; display: grid; gap: 5px; padding: 4px 0; }
.sline { display: flex; align-items: center; gap: 8px; min-width: 0; }
.dk { flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font: 800 12px/1 var(--font-display); background: var(--acc); color: #0b0d12; }
.stitle { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ssub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sprog { display: block; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.sprog i { display: block; height: 100%; width: 0; background: var(--acc); }
.slock { grid-area: lock; width: 40px; height: 44px; display: grid; place-items: center; color: #465064; border-radius: 10px; }
.slock.on { color: var(--acc); }
.svol { grid-area: vol; display: flex; align-items: center; gap: 4px; }
.mute { width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); flex: none; }
.svol .slider { flex: 1; }
.val { width: 56px; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; white-space: nowrap; }
.busy::after { content: ""; position: absolute; top: -4px; left: -4px; right: -4px; bottom: -4px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--acc); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* YouTube players: always on screen while a deck plays YouTube, at least 200 x 200 px as YouTube requires */
.videos { display: grid; gap: 8px; }
.vbox { --acc: var(--a); display: grid; gap: 8px; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.vbox[data-deck="B"] { --acc: var(--b); }
.vbox[hidden] { display: none; }
.vhead { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.yt { position: relative; width: 100%; min-width: 200px; aspect-ratio: 16 / 9; min-height: 200px; background: #000; border-radius: 10px; overflow: hidden; }
.yt iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
.vnote { margin: 0; font-size: 11.5px; line-height: 1.4; color: var(--muted); }
.vnote a { color: var(--muted); }

/* Tabs */
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.tabs button { height: 38px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button.on { background: var(--raise); color: var(--text); }
.tabs button.on[data-deck="A"] { box-shadow: inset 0 -2px 0 var(--a); }
.tabs button.on[data-deck="B"] { box-shadow: inset 0 -2px 0 var(--b); }

/* Deck panel */
.deck { --acc: var(--a); display: flex; flex-direction: column; gap: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 14px 4px; }
.np { display: flex; gap: 14px; align-items: center; }
.art { width: 72px; height: 72px; border-radius: 12px; flex: none; overflow: hidden; background: var(--raise); display: grid; place-items: center; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art .gen { font: 800 26px/1 var(--font-display); color: #0b0d12; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--acc); box-shadow: 0 0 0 7px rgba(255,255,255,.05), 0 0 0 14px rgba(255,255,255,.03); }
.npt { min-width: 0; display: grid; gap: 4px; }
.nptitle { font-weight: 600; font-size: 18px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.npsub { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; background: var(--raise); color: var(--muted); }
.chip.live { color: #fff; background: #c4303e; }
.chip.acc { color: #0b0d12; background: var(--acc); }
.chip.ok { color: #a6e8bc; background: #173022; }
.err { font-size: 14px; line-height: 1.4; color: #ffd0d0; background: #2e1719; border: 1px solid #4d2226; padding: 8px 10px; border-radius: 10px; }

/* Sliders */
.slider { --acc2: var(--acc); position: relative; height: 36px; display: flex; align-items: center; touch-action: pan-y; cursor: pointer; min-width: 60px; }
.slider .track { position: relative; height: 4px; width: 100%; border-radius: 2px; background: var(--line); }
.slider .fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 2px; background: var(--acc2); }
.slider .abz { position: absolute; top: -4px; bottom: -4px; display: none; background: rgba(255,255,255,.14); border-left: 2px solid var(--text); border-right: 2px solid var(--text); }
.slider .thumb { position: absolute; top: 50%; left: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.55); transition: transform .12s; }
.slider.drag .thumb { transform: scale(1.3); }
.slider.disabled { opacity: .35; pointer-events: none; }
.slider.vol .track::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: #3d4659; border-radius: 1px; }
.slider.seek { height: 40px; }
.slider.seek .track { height: 5px; }
.times { display: flex; justify-content: space-between; align-items: center; font: 500 13px var(--font-display); color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -6px; }
.times .rem { padding: 4px 0 4px 16px; color: var(--muted); font: inherit; }

/* Transport */
.transport { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
.tbtn { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: var(--text); }
.tbtn .ic { width: 30px; height: 30px; }
.tbtn:active { background: var(--raise); }
.bigplay { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--acc); color: #0b0d12; position: relative; }
.bigplay .ic { width: 36px; height: 36px; }
.bigplay:active, .pbtn:active { transform: scale(.96); }

/* Quick controls */
.quick { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.q { display: grid; justify-items: center; align-content: center; gap: 3px; padding: 8px 2px 6px; border-radius: 12px; background: var(--raise); color: var(--muted); font-size: 11.5px; font-weight: 600; min-height: 56px; }
.q.on { color: var(--acc); box-shadow: inset 0 0 0 1px var(--acc); }
.q span { font-variant-numeric: tabular-nums; white-space: nowrap; }
.abtxt { font: 800 14px/20px var(--font-display); }

/* Sections */
.sec { border-top: 1px solid var(--line); margin: 0 -14px; padding: 0 14px; }
.sechead { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; text-align: left; color: var(--text); }
.sectitle { font-weight: 600; font-size: 15.5px; flex: none; }
.secsum { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.chev { color: var(--muted); transition: transform .2s; }
.sec.open .chev { transform: rotate(180deg); }
.secbody { padding: 0 0 14px; display: grid; gap: 8px; }

/* Rows and form controls */
.row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.row .slider { flex: 1; }
.lbl { width: 86px; flex: none; font-size: 14px; color: var(--muted); }
.lbl small { font-size: 10px; margin-left: 1px; }
.band { min-height: 34px; }
.band .lbl { width: 44px; font-variant-numeric: tabular-nums; }
.hint { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.hint.warn { color: var(--warn); }
.hint.inl { flex: 1; }
.hint.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
.row.end { justify-content: flex-end; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 2px; flex: 1; min-width: 0; }
.seg button { flex: 1; min-height: 36px; padding: 0 8px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--raise); color: var(--text); box-shadow: inset 0 -2px 0 var(--acc); }
.sw { width: 51px; height: 31px; border-radius: 16px; background: #3a4152; position: relative; flex: none; transition: background .2s; }
.sw i { position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.sw.on { background: var(--acc); }
.sw.on i { transform: translateX(20px); }
.pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 20px; background: var(--raise); font-weight: 600; font-size: 14px; color: var(--text); }
.pill.primary { background: var(--acc); color: #0b0d12; }
.pill.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.pill.on { box-shadow: inset 0 0 0 1.5px var(--acc); color: var(--acc); }
.danger { color: var(--danger) !important; }
.btnrow, .qadd, .chipgrid { display: flex; flex-wrap: wrap; gap: 8px; }
.sel { flex: 1; min-width: 0; min-height: 40px; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font-size: 15px; }

/* Queue */
.qlist { display: grid; gap: 2px; }
.qrow { display: flex; align-items: center; border-radius: 10px; }
.qrow.cur { background: var(--raise); }
.qrow.cur .qtitle { color: var(--acc); }
.qrow.missing .qt { opacity: .5; }
.qmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 8px 4px 8px 6px; text-align: left; min-height: 54px; color: var(--text); }
.qn { width: 24px; flex: none; display: grid; place-items: center; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.qt { min-width: 0; display: grid; gap: 2px; }
.qtitle { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qsub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qmore { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); flex: none; }
.empty { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 2px 0; }
.eqbars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; }
.eqbars b { width: 3px; height: 6px; background: var(--acc); border-radius: 1px; animation: bar 1s ease-in-out infinite; }
.eqbars b:nth-child(2) { animation-delay: -.4s; }
.eqbars b:nth-child(3) { animation-delay: -.7s; }
@keyframes bar { 0%, 100% { height: 4px; } 50% { height: 14px; } }

/* Sheets */
.sheetwrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheetwrap[hidden] { display: none; }
.backdrop { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.6); }
.sheet { --acc: var(--a); position: relative; width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; background: var(--panel); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 8px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 22px) calc(env(safe-area-inset-left) + 16px); display: grid; gap: 12px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: #3a4152; margin: 0 auto 2px; }
.sheet h2 { margin: 0; font: 700 19px/1.25 var(--font-display); text-wrap: balance; padding-right: 44px; overflow-wrap: anywhere; }
.sheet h3 { margin: 10px 0 0; font-size: 12.5px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 700; }
.sheet .close { position: absolute; top: 8px; right: 8px; }
.bigval { font: 700 44px/1 var(--font-display); text-align: center; font-variant-numeric: tabular-nums; color: var(--acc); padding: 6px 0 0; }
.menu { display: grid; }
.menu button { display: flex; align-items: center; gap: 12px; min-height: 52px; text-align: left; font-size: 16px; border-top: 1px solid var(--line); color: var(--text); }
.menu button .ic { color: var(--muted); }
.linkbox { font-size: 13px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; overflow-wrap: anywhere; -webkit-user-select: text; user-select: text; }
textarea, input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; color: var(--text); resize: vertical; }
textarea::placeholder, input::placeholder { color: #5c6578; }
.fl { font-size: 13px; color: var(--muted); margin-bottom: -6px; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; min-height: 44px; }
.check input { width: 22px; height: 22px; accent-color: var(--acc); }
.statusline { margin: 0; font-size: 15px; }

/* Toasts */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 16px); display: grid; justify-items: center; gap: 8px; pointer-events: none; z-index: 60; padding: 0 16px; }
.toast { max-width: 520px; background: #222a3b; border: 1px solid #34405b; color: var(--text); font-size: 14px; line-height: 1.4; padding: 10px 14px; border-radius: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.45); opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; }
.toast.in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 36 36" aria-hidden="true"><circle cx="13" cy="18" r="10.5" fill="#ff8a1f"/><circle cx="23" cy="18" r="10.5" fill="#2fd0c3" fill-opacity=".86"/><circle cx="13" cy="18" r="2.4" fill="#0b0d12"/><circle cx="23" cy="18" r="2.4" fill="#0b0d12"/></svg>
      <div><h1>DualDeck</h1><p id="tagline">Two players, one mix</p></div>
    </div>
    <button class="ibtn" id="master" data-act="master" aria-label="Pause both decks"></button>
    <button class="ibtn" id="gear" data-act="openSettings" aria-label="Settings"></button>
  </header>
  <div class="banners" id="banners"></div>
  <section class="mixer" id="mixer" aria-label="Mixer"></section>
  <section class="videos" aria-label="YouTube players">
    <div class="vbox" id="vbox-A" data-deck="A" hidden>
      <div class="vhead"><b class="dk">A</b>Deck A · YouTube</div>
      <div class="yt" id="yt-A"></div>
      <p class="vnote">Plays in YouTube’s own player under the <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube Terms of Service</a> and the <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a>.</p>
    </div>
    <div class="vbox" id="vbox-B" data-deck="B" hidden>
      <div class="vhead"><b class="dk">B</b>Deck B · YouTube</div>
      <div class="yt" id="yt-B"></div>
      <p class="vnote">Plays in YouTube’s own player under the <a href="https://www.youtube.com/t/terms" target="_blank" rel="noopener">YouTube Terms of Service</a> and the <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">Google Privacy Policy</a>.</p>
    </div>
  </section>
  <nav class="tabs" id="tabs" aria-label="Choose a deck">
    <button data-act="tab" data-deck="A" id="tabA">Deck A controls</button>
    <button data-act="tab" data-deck="B" id="tabB">Deck B controls</button>
  </nav>
  <main class="deck" id="deck"></main>
</div>
<input type="file" id="filepick" class="vh" multiple tabindex="-1" aria-hidden="true">
<div class="sheetwrap" id="sheetwrap" hidden>
  <div class="backdrop" data-act="closeSheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></div>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="media-host" hidden></div>
<script>
'use strict';
var PREVIEW = false;
var VERSION = '1.2';
var KEY = 'dualdeck.state.v1', SKEY = 'dualdeck.settings.v1';

/* ---------------- small helpers ---------------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

  paint: function (d) {
    $$('.slider[data-deck="' + d.id + '"]').forEach(function (s) { if (!(drag && drag.s === s)) paintSlider(s); });
    $$('[data-val][data-deck="' + d.id + '"]').forEach(function (el) { el.textContent = valText(el.dataset.val, d); });
    $$('.mute[data-deck="' + d.id + '"]').forEach(function (b) { b.innerHTML = icon(d.muted || !d.volume ? 'voloff' : 'vol', 'ic sm'); });
    var q = $('#deck .q[data-act="speed"]'); if (q && this.tab === d.id) q.classList.toggle('on', d.rate !== 1);
  },
  paintSleep: function () {
    DECKS.forEach(function (d) { $$('[data-sleep="' + d.id + '"]').forEach(function (el) { el.textContent = sleepLabel(d); }); });
  },
  paintMaster: function () {
    var b = $('#master'); if (!b) return;
    var on = app.anyPlaying();
    b.innerHTML = icon(on ? 'pause' : 'play');
    b.setAttribute('aria-label', on ? 'Pause both decks' : 'Resume playback');
  },
  paintDiag: function () {
    var el = $('[data-diag]'); if (!el) return;
    el.textContent = [
      PREVIEW ? 'Preview inside Claude' : standalone ? 'Home Screen app' : 'Browser tab',
      'Web Audio: ' + (engine.ctx ? engine.ctx.state : engine.ok ? 'starts on first tap' : 'unavailable'),
      'Audio session: ' + (navigator.audioSession ? navigator.audioSession.type : 'not supported'),
      'Offline cache: ' + swState
    ].join(' · ');
  },
  renderBanners: function () {
    var b = app.banners;
    $('#banners').innerHTML = Object.keys(b).map(function (id) {
      var x = b[id];
      return '<div class="banner ' + x.kind + '" role="status"><p>' + esc(x.text) + '</p>' +
        (x.label ? '<button class="act" data-act="bannerAct" data-id="' + id + '">' + esc(x.label) + '</button>' : '') +
        '<button class="x" data-act="bannerX" data-id="' + id + '" aria-label="Dismiss">' + icon('close', 'ic sm') + '</button></div>';
    }).join('');
  },
  openSheet: function (kind, d, i) {
    var sh = $('#sheet'), same = this.sheet && this.sheet.kind === kind, top = sh.scrollTop;
    this.sheet = { kind: kind, d: d, i: i };
    sh.style.setProperty('--acc', d ? 'var(--' + d.id.toLowerCase() + ')' : 'var(--a)');
    sh.setAttribute('aria-label', kind);
    sh.innerHTML = '<div class="grab"></div><button class="ibtn close" data-act="closeSheet" aria-label="Close">' + icon('close') + '</button>' + SHEETS[kind](d, i);
    $$('.slider', sh).forEach(paintSlider);
    $('#sheetwrap').hidden = false;
    if (same) sh.scrollTop = top; else { sh.scrollTop = 0; try { sh.focus({ preventScroll: true }); } catch (e) {} }
    if (kind === 'settings') { this.paintDiag(); this.paintStorage(); }
  },
  closeSheet: function () { $('#sheetwrap').hidden = true; this.sheet = null; },
  paintStorage: function () {
    var el = $('[data-storage]'); if (!el) return;
    var n = 0; DECKS.forEach(function (d) { d.queue.forEach(function (it) { if (it.kind === 'file' && it.saved) n++; }); });
    var base = n + ' file' + (n === 1 ? '' : 's') + ' kept in the app.';
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (e) { el.textContent = base + ' Using ' + fmtBytes(e.usage || 0) + (e.quota ? ' of about ' + fmtBytes(e.quota) + ' available.' : '.'); }).catch(function () { el.textContent = base; });
    } else el.textContent = base;
  }
};

/* ---------------- actions ---------------- */
function twoStep(t, label, fn) {
  if (t.dataset.armed) { delete t.dataset.armed; fn(); return; }
  var orig = t.textContent; t.dataset.armed = '1'; t.textContent = label;
  setTimeout(function () { if (t.dataset.armed) { delete t.dataset.armed; t.textContent = orig; } }, 3500);
}
var ACTIONS = {
  toggle: function (a) { a.d.toggle(); },
  tab: function (a) { ui.select(a.d.id); },
  setLock: function (a) { settings.lockDeck = a.d.id; app.save(); app.updateMediaSession(); ui.renderStrips(); toast('Lock screen now shows Deck ' + a.d.id); },
  mute: function (a) { a.d.toggleMute(); },
  prev: function (a) { a.d.prev(); },
  next: function (a) { a.d.next(false); },
  back: function (a) { a.d.skip(-settings.back); },
  fwd: function (a) { a.d.skip(settings.fwd); },
  remain: function () { settings.remain = !settings.remain; app.save(); DECKS.forEach(function (d) { ui.tick(d); }); },
  speed: function (a) { ui.openSheet('speed', a.d); },
  rate: function (a) { a.d.setRate(+a.v); ui.openSheet('speed', a.d); },
  pitch: function (a) { a.d.setKeepPitch(!a.d.keepPitch); ui.openSheet('speed', a.d); },
  repeat: function (a) { a.d.cycleRepeat(); },
  shuffle: function (a) { a.d.toggleShuffle(); },
  ab: function (a) { a.d.cycleAB(); },
  sleep: function (a) { ui.openSheet('sleep', a.d); },
  setSleep: function (a) {
    var m = +a.v;
    (settings.sleepBoth ? DECKS : [a.d]).forEach(function (d) { d.setSleep(m); });
    ui.closeSheet(); ui.renderDeck();
    toast(m === 0 ? 'Sleep timer off' : m === -1 ? 'Stops at the end of the current item' : 'Stops in ' + m + ' min');
  },
  sec: function (a) { var k = a.t.dataset.sec; settings.sections[k] = !settings.sections[k]; app.save(); ui.renderDeck(); },
  addFiles: function (a) { ui.fileDeck = a.d.id; var inp = $('#filepick'); inp.value = ''; inp.click(); },
  addURL: function (a) {
    ui.openSheet('url', a.d);
    setTimeout(function () {
      var t = $('#urlIn'), f = document.activeElement;
      if (t && (!f || f === document.body || f === $('#sheet'))) t.focus(); // never steal focus from a field already tapped
    }, 60);
  },
  urlAdd: function (a) { submitURL(a.d, false); },
  urlAddPlay: function (a) { submitURL(a.d, true); },
  playAt: function (a) {
    ui.closeSheet();
    var it = a.d.queue[a.i]; if (!it) return;
    if (a.i === a.d.index && a.d.loaded()) a.d.toggle();
    else a.d.load(a.i, { autoplay: true });
  },
  itemMenu: function (a) { ui.openSheet('item', a.d, a.i); },
  moveUp: function (a) { a.d.move(a.i, -1); ui.closeSheet(); },
  moveDown: function (a) { a.d.move(a.i, 1); ui.closeSheet(); },
  sendTo: function (a) {
    var it = a.d.queue[a.i], o = other(a.d); if (!it) return;
    a.d.removeAt(a.i, true); o.addItems([it], false); ui.closeSheet(); toast('Moved to Deck ' + o.id);
  },
  copyTo: function (a) {
    var it = a.d.queue[a.i], o = other(a.d); if (!it) return;
    var c = {}; for (var k in it) if (Object.prototype.hasOwnProperty.call(it, k) && k !== '_art' && k !== '_tags') c[k] = it[k];
    c.id = uid(); c.pos = 0; if (c.kind === 'file' && !c.blobKey) c.blobKey = it.id;
    o.addItems([c], false); ui.closeSheet(); toast('Copied to Deck ' + o.id);
  },
  copyLink: function (a) {
    var it = a.d.queue[a.i]; if (!it) return;
    try { navigator.clipboard.writeText(it.url).then(function () { toast('Link copied'); }, function () { toast('Copying was blocked. Long-press the link above to copy it.'); }); }
    catch (e) { toast('Copying was blocked. Long-press the link above to copy it.'); }
  },
  removeItem: function (a) { a.d.removeAt(a.i, false); ui.closeSheet(); },
  clearQ: function (a) { twoStep(a.t, 'Tap again to clear', function () { a.d.clearQueue(); toast('Deck ' + a.d.id + ' cleared'); }); },
  engine: function (a) { a.d.setEngine(a.v); },
  mono: function (a) { a.d.setMono(!a.d.mono); },
  comp: function (a) { a.d.setComp(a.v); },
  eqOn: function (a) { a.d.setEqOn(!a.d.eq.on); },
  eqReset: function (a) { a.d.setPreset('Flat'); },
  openSettings: function () { ui.openSheet('settings'); },
  set: function (a) {
    var k = a.t.dataset.k, v = a.v;
    settings[k] = (k === 'back' || k === 'fwd') ? +v : v;
    app.save();
    if (k === 'lockDeck') app.updateMediaSession();
    if (k === 'lockButtons') app.setLockButtons();
    ui.render(); ui.openSheet('settings');
  },
  keepFiles: function () {
    settings.keepFiles = !settings.keepFiles; app.save();
    if (settings.keepFiles) { var all = []; DECKS.forEach(function (d) { d.queue.forEach(function (it) { if (it.kind === 'file' && it._file && !it.saved) all.push(it); }); }); app.storeFiles(all); }
    ui.openSheet('settings');
  },
  resumeSet: function () { settings.resume = !settings.resume; app.save(); ui.openSheet('settings'); },
  mixOthers: function () {
    if (!navigator.audioSession) return;
    settings.mixOthers = !settings.mixOthers; app.save();
    setAudioSession();
    // Restart playing decks inside this tap so iOS applies the new audio type now.
    DECKS.forEach(function (d) { if (d.isPlaying() && !d.isYT()) { try { d.el.pause(); } catch (e) {} d.playEl(); } });
    ui.render(); ui.openSheet('settings');
    toast(settings.mixOthers ? 'Mix on: other apps keep playing. DualDeck goes quiet when you lock the phone, leave DualDeck or turn on Silent mode.' : 'Mix off: DualDeck can play in the background again, and it pauses other apps’ audio.', 6000);
  },
  wipe: function (a) {
    twoStep(a.t, 'Tap again to delete', function () {
      idb.clear().catch(function () {});
      DECKS.forEach(function (d) { d.queue.forEach(function (it) { if (it.kind === 'file') it.saved = false; }); });
      app.save(); ui.render(); ui.openSheet('settings');
      toast('Stored files deleted. Items from this session still play until you close the app.');
    });
  },
  repair: function () { ui.closeSheet(); app.repairAudio(); },
  closeSheet: function () { ui.closeSheet(); },
  master: function () { app.masterToggle(); },
  bannerAct: function (a) { var id = a.t.dataset.id, b = app.banners[id]; app.hideBanner(id); if (b && b.fn) b.fn(); },
  bannerX: function (a) { var id = a.t.dataset.id; if (id === 'preview' || id === 'install') { settings.hidden[id] = true; app.save(); } app.hideBanner(id); }
};
function submitURL(d, play) {
  var t = $('#urlIn'), n = $('#urlName');
  var text = t ? t.value : '', name = n ? n.value.trim() : '';
  app.addURLs(text, name, d, play).then(function (ok) { if (ok) ui.closeSheet(); });
}
document.addEventListener('click', function (e) {
  var t = e.target.closest && e.target.closest('[data-act]');
  if (!t || t.disabled) return;
  var f = ACTIONS[t.dataset.act]; if (!f) return;
  f({ t: t, d: t.dataset.deck ? decks[t.dataset.deck] : null, i: t.dataset.i != null ? +t.dataset.i : -1, v: t.dataset.v, e: e });
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id && t.id.indexOf('preset-') === 0) decks[t.dataset.deck].setPreset(t.value);
  else if (t.id === 'sleepBoth') { settings.sleepBoth = t.checked; app.save(); }
  else if (t.id === 'filepick') { if (t.files && t.files.length) app.importFiles(t.files, decks[ui.fileDeck] || decks[ui.tab]); }
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden') { app.saveNow(); return; }
  if (engine.ctx && engine.ctx.state !== 'running' && DECKS.some(function (d) { return d.wantPlay; })) {
    try { var p = engine.ctx.resume(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
    setTimeout(function () { app.onCtxState(); }, 700);
  }
  var stopped = DECKS.filter(function (d) { return d.wantPlay && d.loaded() && !d.isYT() && d.el.paused && !d.el.ended; });
  if (stopped.length) {
    var names = stopped.map(function (d) { return d.id; }).join(' and ');
    var mixerCut = stopped.some(function (d) { return d.sysPaused === 'mixer'; });
    if (settings.mixOthers) mixerCut = 'mix';
    app.showBanner('resume', mixerCut === 'mix'
      ? 'Deck ' + names + ' paused while you were away: with Mix with other apps on, iOS doesn’t let DualDeck play in the background. Turn Mix off in Settings to keep playing.'
      : mixerCut
      ? 'iOS stopped the Mixer engine for Deck ' + names + ' while the screen was locked, so playback paused where it stopped. If this keeps happening, switch that deck to Direct in Sound.'
      : 'iOS paused Deck ' + names + ' while DualDeck was in the background.', 'Resume', function () { stopped.forEach(function (d) { d.sysPaused = false; d.play(); }); }, 'warn');
  }
  ui.render();
});
window.addEventListener('pagehide', function () { app.saveNow(); });

/* ---------------- lock-screen artwork ---------------- */
function genArt(id) {
  try {
    var c = document.createElement('canvas'); c.width = c.height = 512;
    var g = c.getContext('2d'), acc = id === 'A' ? '#ff8a1f' : '#2fd0c3';
    g.fillStyle = '#12151d'; g.fillRect(0, 0, 512, 512);
    for (var r = 236; r > 100; r -= 12) { g.beginPath(); g.arc(256, 256, r, 0, Math.PI * 2); g.strokeStyle = 'rgba(255,255,255,0.045)'; g.lineWidth = 2; g.stroke(); }
    g.beginPath(); g.arc(256, 256, 96, 0, Math.PI * 2); g.fillStyle = acc; g.fill();
    g.fillStyle = '#12151d'; g.font = '800 116px -apple-system, system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(id, 256, 262);
    return c.toDataURL('image/png');
  } catch (e) { return ''; }
}

/* ---------------- start ---------------- */
(function init() {
  DECKS = [new Deck('A'), new Deck('B')];
  decks = { A: DECKS[0], B: DECKS[1] };
  var saved = store.get(KEY, null);
  if (saved && saved.A) { decks.A.restore(saved.A); decks.B.restore(saved.B); }
  else {
    decks.A.queue.push(demoItem('chime')); decks.A.index = 0;
    decks.B.queue.push(demoItem('brown')); decks.B.index = 0;
    DECKS.forEach(function (d) { d.updateLoop(); });
  }
  if (!settings.resume) DECKS.forEach(function (d) { d.queue.forEach(function (it) { it.pos = 0; }); });
  setAudioSession();
  ART.A = genArt('A'); ART.B = genArt('B');
  $('#gear').innerHTML = icon('gear');
  ui.tab = settings.tab === 'B' ? 'B' : 'A';
  ui.render();
  app.setupMediaSession();
  app.updateMediaSession();
  setInterval(function () { app.tick(); }, 1000);
  if (PREVIEW) {
    if (!settings.hidden.preview) app.showBanner('preview', 'Preview inside Claude: it plays files from your iPhone. Online links, offline use and Home Screen install need the full version (setup steps are in the chat).');
  } else {
    if (isIOS && !standalone && !settings.hidden.install) app.showBanner('install', 'Install: tap Share, then Add to Home Screen. DualDeck then opens full screen and works without a connection.');
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('sw.js').then(function () { swState = 'ready'; ui.paintDiag(); }).catch(function () { swState = 'unavailable'; ui.paintDiag(); });
    } else swState = 'unavailable';
  }
})();
</script>
